{% extends "base.html" %}
{% block title %}Kirjuta nimi{% endblock %}

{% block content %}
<section class="mis_on_pildil_mang">
    <h1>Mis on sellel pildil?</h1>

    <img class="mis_on_pildil" src="{{ url_for('static', filename='pildid/' + kusimus.pilt) }}"
         alt="Mis see on?" >

    {% if tulemus %}
    {% if tulemus.oige %}
        <p class="teade voit">Õige! 😽</p>
    {% else %}
        <p class="teade kaotus">Vale! Õige vastus oli: {{ tulemus.sona }}😿</p>
    {% endif %}

    <a class="mis_on_pildil_nupp" href="/nimi/uus">Järgmine pilt</a>
    {% endif %}

    

    <form method="post" action="/nimi/vasta">
        <input type="text" name="vastus">
        <button class="mis_on_pildil_nupp" type="submit">Vasta</button>
    </form>
</section>
{% endblock %}
